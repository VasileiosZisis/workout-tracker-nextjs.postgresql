name: workout-tracker-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workout_test
      POSTGRES_PASSWORD: workout_test
      POSTGRES_DB: workout_tracker_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U workout_test -d workout_tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  test_postgres_data:
